function buildBg(){

 [14,LW-38].forEach(fx=>{R(fx,10,24,26,'#8e2230');R(fx,10,24,2,'#f1c40f');for(let i=0;i<6;i++)R(fx+i*2,36+i,24-i*4,1,'#8e2230');txt('KO',fx+12,18,2,'#f1c40f','c','#4a0f18')});
 x=bgB.getContext('2d');
 R(0,118,LW,62,'#0d0712');
 for(let y=118;y<142;y++){const t=(y-118)/24,l=Math.round(34-26*t),r=Math.round(LW-34+26*t);R(l,y,r-l,1,'rgb('+(34+t*16|0)+','+(64+t*22|0)+','+(138+t*34|0)+')')}
 for(let k=-6;k<=6;k++)for(let y=118;y<142;y++){const t=(y-118)/24,xx=Math.round(cxm+k*((LW-68)+52*t)/12);R(xx,y,1,1,'rgba(0,0,20,.28)')}
 for(let a=0;a<PI*2;a+=.025)R(Math.round(cxm+Math.cos(a)*44),Math.round(130+Math.sin(a)*7),2,1,'#9fbdf7');
 for(let a=0;a<PI*2;a+=.04)R(Math.round(cxm+Math.cos(a)*30),Math.round(130+Math.sin(a)*4.5),1,1,'#6f90dd');
 txt('RING',cxm,127,1,'#7fa2ee','c',null);
 R(6,142,LW-12,3,'#f0f0f5');R(6,145,LW-12,1,'#9a9ab0');R(6,146,LW-12,34,'#a4262f');
 for(let xx=6;xx<LW-6;xx+=6){R(xx,146,2,34,'#7d1c24');R(xx+2,146,1,34,'#c23842')}
 R(6,146,LW-12,2,'#f1c40f');R(6,170,LW-12,10,'rgba(0,0,0,.3)');R(6,176,LW-12,4,'rgba(0,0,0,.35)');
 txt('RING 2D',cxm,153,2,'#ffd23f','c','#4a0f18');
 const ry=[88,98,108],rc=['#e0353b','#f4f4f4','#3b72e6'],ry2=[96,108,120];
 [34,LW-34].forEach(bx=>{R(bx-2,76,5,46,'#9aa0b2');R(bx-2,76,1,46,'#d8dcea');R(bx+2,76,1,46,'#5a6074');R(bx-3,73,7,3,'#c9ced9')});
 for(let i=0;i<3;i++){
  for(let xr=34;xr<=LW-34;xr++){const sg=Math.round(Math.sin((xr-34)/(LW-68)*PI)*3);R(xr,ry[i]+sg-1,1,3,rc[i]);R(xr,ry[i]+sg-1,1,1,'rgba(255,255,255,.35)');R(xr,ry[i]+sg+2,1,1,'rgba(0,0,0,.35)')}
  ln(34,ry[i],8,ry2[i],3,rc[i]);ln(LW-34,ry[i],LW-8,ry2[i],3,rc[i]);
  [34,LW-34].forEach(bx=>{R(bx-4,ry[i]-3,9,7,'#c0272d');R(bx-4,ry[i]-3,9,1,'#e8575c');R(bx-4,ry[i]+3,9,1,'#7d1519')});
 }
 x=fgL.getContext('2d');

 for(let y=118;y<146;y++){const t=(y-132)/14,w=Math.sqrt(Math.max(0,1-t*t))*LW*.42;R(Math.round(cxm-w),y,Math.round(w*2),1,'rgba(255,245,210,.06)')}
 [6,LW-6].forEach(fx=>{R(fx-4,84,8,64,'#a8aebf');R(fx-4,84,2,64,'#dde1ee');R(fx+2,84,2,64,'#5a6074');R(fx-5,81,10,4,'#c9ced9');R(fx-6,144,12,6,'#4d5262');[92,104,116].forEach(py=>{R(fx-5,py-5,10,10,'#c0272d');R(fx-5,py-5,10,2,'#ec666b');R(fx-5,py+3,10,2,'#7d1519')})});
 crowd=[];
 [{y:62,l:16},{y:78,l:24},{y:94,l:33}].forEach((rw,ri)=>{for(let px=-3+ri*4;px<LW+6;px+=9+((px+ri)&1)){crowd.push({x:px,y:rw.y,sh:'hsl('+(Math.random()*360|0)+',45%,'+rw.l*.7+'%)',sk:'hsl('+(18+Math.random()*14|0)+',42%,'+(rw.l+10)+'%)',hr:'hsl('+(Math.random()*40|0)+',35%,'+rw.l*.4+'%)',ph:Math.random()*6.28})}});
 x=main}
function drawCrowd(){const e=exc;for(const c of crowd){const b=Math.round(Math.sin(gt*(3+e*8)+c.ph)*(.6+e*2.2)),yy=c.y+b;R(c.x-4,yy+6,9,16,c.sh);R(c.x-3,yy,7,6,c.sk);R(c.x-3,yy,7,2,c.hr);if(Math.sin(gt*7+c.ph*3)>1.1-e*1.6){R(c.x-6,yy-5,2,9,c.sk);R(c.x+5,yy-5,2,9,c.sk)}}

/* ---------- dessin des boxeurs ---------- */
const jabG=p=>[lp(3,34,p),-38],hookG=p=>[lp(-9,28,p),-36-Math.sin(cl(p,0,1)*PI)*4],cntG=p=>[lp(-10,36,p),-38];
function pose(f){
 const P={ld:[12,-37],rd:[8,-33],lean:0,hx:0,hy:0,cr:0,lo:0,fs:0,ang:1,mouth:0,eye:0,rf:0,glow:0,tr:null,trT:0,stars:0};
 const s=f.s,T=f.sT,b=Math.round(Math.sin(f.t*6+f.ph));
 if(state==='end'&&f.hp>0&&s==='idle'){const win=(res==='win')===(f===me);
  if(win){const j=Math.round(Math.abs(Math.sin(f.t*7))*2);P.ld=[8,-63-j];P.rd=[-4,-61-j];P.mouth=1;P.hy=-j;P.cr=-j;P.ang=0}
  else{P.ld=[8,-28];P.rd=[4,-26];P.cr=2;P.hy=2;P.ang=0}
  return P}
 switch(s){
 case'idle':P.ld[1]+=b;P.rd[1]+=b;P.cr=b>0?1:0;P.hy=b>0?1:0;break;
 case'walk':P.lo=Math.round(Math.sin(f.t*14)*3);P.lean=1;P.ld[1]+=b;P.rd[1]+=b;break;
 case'block':P.ld=[13,-44];P.rd=[10,-41];P.lean=-1;P.cr=2;P.hx=-1;P.ang=0;break;
 case'atk':{const a=f.at,t=a?a.t:1,w=a?a.w:.1,st=a?a.s:.1,r=a?a.r:.1;
  if(a&&a.type==='jab'){
   if(t<w){const p=ES(t/w);P.ld=[lp(12,3,p),lp(-37,-35,p)];P.lean=-p*2;P.cr=1;P.hx=-1}
   else if(t<w+st){const p=(t-w)/st;P.ld=jabG(p);P.lean=lp(-2,4,p);P.fs=Math.round(2*p);P.hx=2;P.tr=jabG;P.trT=p}
   else{const p=ES((t-w-st)/r);P.ld=[lp(34,12,p),lp(-38,-37,p)];P.lean=lp(4,0,p);P.fs=Math.round(2*(1-p));P.hx=Math.round(2*(1-p))}
  }else if(a){
   if(t<w){const p=ES(t/w);P.rd=[lp(8,-9,p),lp(-33,-36,p)];P.lean=-p*3;P.cr=2;P.hx=-1;P.rf=1}
   else if(t<w+st){const p=(t-w)/st;P.rd=hookG(p);P.lean=lp(-3,6,p);P.fs=3;P.hx=2;P.rf=1;P.tr=hookG;P.trT=p}
   else{const p=ES((t-w-st)/r),g=hookG(1);P.rd=[lp(g[0],8,p),lp(g[1],-33,p)];P.lean=lp(6,0,p);P.fs=Math.round(3*(1-p));P.rf=1}
  }break}
 case'parry':{const p=ES(T/.08);P.ld=[lp(12,23,p),lp(-37,-32,p)];P.rd=[8,-35];P.lean=-2;P.cr=1;P.hx=-1;P.glow=T<PW?1:0;break}
 case'pfail':P.ld=[5,-26];P.rd=[3,-24];P.lean=2;P.cr=3;P.mouth=1;P.hy=2;P.ang=0;break;
 case'counter':{
  if(T<.11){const p=ES(T/.11);P.rd=[lp(8,-10,p),lp(-33,-35,p)];P.lean=-4*p;P.cr=2;P.rf=1}
  else if(T<.23){const p=(T-.11)/.12;P.rd=cntG(p);P.lean=lp(-4,7,p);P.fs=4;P.hx=2;P.rf=1;P.tr=cntG;P.trT=p}
  else{const p=ES((T-.23)/.27);P.rd=[lp(36,8,p),lp(-38,-33,p)];P.lean=lp(7,0,p);P.fs=Math.round(4*(1-p));P.rf=1}break}
 case'hit':{const k=1-T/Math.max(.01,f.sd);P.hx=-Math.round(5*cl(k,0,1));P.hy=Math.round(2*cl(k,0,1));P.lean=-Math.round(3*cl(k,0,1));P.ld=[6,-28];P.rd=[3,-27];P.eye=1;P.mouth=1;P.cr=1;P.ang=0;break}
 case'stagger':{const sw=Math.round(Math.sin(f.t*7)*2);P.lean=sw-2;P.ld=[7,-28];P.rd=[4,-27];P.eye=1;P.mouth=1;P.cr=2;P.hy=2;P.ang=0;P.stars=1;break}
 case'ko':{const k=Math.min(1,T/.3);P.lean=-Math.round(12*k);P.hx=-Math.round(10*k);P.hy=Math.round(6*k);P.cr=Math.round(2+4*k);P.ld=[-2,-30];P.rd=[-6,-28];P.eye=1;P.mouth=1;P.ang=0;break}
 }
 return P}
function glove(gx,gy,ux,uy,c,Hh,D){gx=Math.round(gx);gy=Math.round(gy);
 R(Math.round(gx-ux*5)-2,Math.round(gy-uy*5)-2,5,5,'#f1f1f1');
 R(gx-3,gy-4,7,9,c);R(gx-4,gy-3,9,7,c);R(gx+1,gy-5,3,2,c);
 R(gx-2,gy-3,3,2,Hh);R(gx-3,gy-2,1,2,Hh);
 R(gx-3,gy+3,7,1,D);R(gx+3,gy-2,1,5,D);R(gx+4,gy-1,1,3,D)}
function arm(sx,sy,gx,gy,p,th,far){
